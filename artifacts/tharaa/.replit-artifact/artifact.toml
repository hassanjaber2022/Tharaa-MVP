kind = "web"
previewPath = "/"
title = "Tharaa | ثراء"
description = "منصة عربية تساعد الشباب على بناء خطة احتياط مالي ودخل مستقبلي توضيحي عبر حاسبة وخطط محفوظة."
version = "1.0.0"
id = "artifacts/tharaa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20970

[services.development]
run = "pnpm --filter @workspace/tharaa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tharaa", "run", "build" ]
serve = "static"
publicDir = "artifacts/tharaa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20970"
BASE_PATH = "/"
